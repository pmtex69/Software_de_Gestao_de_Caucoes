<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QR218BYNK7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-QR218BYNK7');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedroTeixeira - Gestor de Garantias CCP</title>
    <!-- Tailwind CSS para o design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para transpilar JSX no browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [items, setItems] = useState([]);
            const [isLoaded, setIsLoaded] = useState(false);
            
            const defaultStages = [
                { id: 1, percent: 30 }, { id: 2, percent: 30 }, 
                { id: 3, percent: 15 }, { id: 4, percent: 15 }, 
                { id: 5, percent: 10 }
            ];

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            useEffect(() => {
                const savedData = localStorage.getItem('ccp_garantias_data');
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        if (Array.isArray(parsed)) setItems(parsed);
                    } catch (e) { console.error("Erro ao carregar histórico", e); }
                }
                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (isLoaded) localStorage.setItem('ccp_garantias_data', JSON.stringify(items));
            }, [items, isLoaded]);

            const addItem = () => {
                const newItem = {
                    id: Date.now(),
                    descricao: '',
                    valorContrato: 0,
                    taxaCaucao: 5,
                    dataInicio: new Date().toISOString().split('T')[0],
                    stages: [...defaultStages]
                };
                setItems([newItem, ...items]);
            };

            const updateItem = (id, field, value) => {
                setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const updateItemStage = (itemId, stageId, newPercent) => {
                setItems(items.map(item => {
                    if (item.id === itemId) {
                        const newStages = item.stages.map(s => s.id === stageId ? { ...s, percent: Number(newPercent) } : s);
                        return { ...item, stages: newStages };
                    }
                    return item;
                }));
            };

            const deleteItem = (id) => {
                if(window.confirm("Eliminar este contrato?")) setItems(items.filter(item => item.id !== id));
            };

            const calculateResults = (item) => {
                const valorContrato = parseFloat(item.valorContrato) || 0;
                const taxaCaucao = parseFloat(item.taxaCaucao) || 0;
                const valorCaucao = (valorContrato * (taxaCaucao / 100));
                const dataBase = new Date(item.dataInicio);
                
                const calendar = item.stages.map((stage, index) => {
                    const dataLibertacao = new Date(dataBase);
                    dataLibertacao.setFullYear(dataBase.getFullYear() + (index + 1));
                    return { data: isNaN(dataLibertacao.getTime()) ? item.dataInicio : dataLibertacao.toISOString().split('T')[0], valor: (valorCaucao * (stage.percent / 100)) };
                });
                return { valorCaucao, calendar };
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900">
                    <nav className="bg-slate-900 text-white px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-xl">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-500 p-2 rounded-lg">
                                <i data-lucide="shield-check"></i>
                            </div>
                            <div>
                                <span className="block font-bold text-lg leading-none italic text-white">PedroTeixeira</span>
                                <span className="text-[10px] text-indigo-300 font-bold uppercase tracking-widest text-opacity-80">Gestão de Garantias CCP</span>
                            </div>
                        </div>
                        <button onClick={addItem} className="bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-lg">
                            <i data-lucide="plus-circle" className="w-4 h-4"></i> Novo Contrato
                        </button>
                    </nav>

                    <main className="max-w-7xl mx-auto p-6 md:p-8">
                        {items.length === 0 ? (
                            <div className="bg-white rounded-3xl border-2 border-dashed border-slate-200 p-20 text-center">
                                <h2 className="text-2xl font-black text-slate-700">Sem contratos registados</h2>
                                <p className="text-slate-400 mt-2">Adicione um novo contrato para iniciar a gestão.</p>
                            </div>
                        ) : (
                            items.map((item) => {
                                const { valorCaucao, calendar } = calculateResults(item);
                                return (
                                    <div key={item.id} className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden p-8 mb-6">
                                        <div className="flex justify-between mb-6">
                                            <div className="flex-1">
                                                <input className="bg-transparent text-xl font-black text-slate-800 w-full outline-none" value={item.descricao} placeholder="Descrição do contrato" onChange={(e) => updateItem(item.id, 'descricao', e.target.value)} />
                                            </div>
                                            <button onClick={() => deleteItem(item.id)} className="text-slate-300 hover:text-red-500"><i data-lucide="trash-2"></i></button>
                                        </div>
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                            <div className="space-y-4">
                                                <input type="number" className="w-full bg-slate-50 border p-3 rounded-xl font-bold" value={item.valorContrato} placeholder="Valor do contrato" onChange={(e) => updateItem(item.id, 'valorContrato', e.target.value)} />
                                                <input type="number" className="w-full bg-indigo-50 border p-3 rounded-xl font-black text-indigo-700" value={item.taxaCaucao} onChange={(e) => updateItem(item.id, 'taxaCaucao', e.target.value)} />
                                            </div>
                                            <div className="lg:col-span-2">
                                                <div className="grid grid-cols-5 gap-2">
                                                    {item.stages.map((s, idx) => (
                                                        <div key={s.id} className="bg-slate-50 p-3 rounded-xl border">
                                                            <input type="number" className="w-full font-black text-sm bg-transparent" value={s.percent} onChange={(e) => updateItemStage(item.id, s.id, e.target.value)} />
                                                            <div className="text-[10px] text-indigo-600 mt-1">{calendar[idx].valor.toFixed(0)}€</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </main>

                    <footer className="bg-slate-900 text-white p-10 mt-10">
                        <div className="max-w-7xl mx-auto text-center space-y-4">
                            <p className="font-bold">Se gostou, veja aqui mais ferramentas e os nossos cursos sempre atualizados com as novas alterações ao CCP:</p>
                            <a href="https://www.consultoria-ccp.pt/" target="_blank" className="text-indigo-400 font-black underline">https://www.consultoria-ccp.pt/</a>
                            <p>Contacte-nos: <a href="mailto:pedro@consultoria-ccp.pt" className="text-indigo-400 underline">pedro@consultoria-ccp.pt</a></p>
                            <p className="text-xs text-slate-500 pt-4">PedroTeixeira© - Gestão de Garantias</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
